<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>基数変換マスター（変換編）</title>
    <link rel="stylesheet" href="common.css?ver=104">
    <style>
        #streakCount { color: #e67e22; font-weight: bold; }
    </style>
</head>
<body>

<div id="menuPage" class="page active">
    <div class="menu-area">
        <h1>基数変換マスター（変換編）</h1>
        <button onclick="showSelection('10toN')">10進数 → n進数</button>
        <button onclick="showSelection('Nto10')">n進数 → 10進数</button>
        <button onclick="showSelection('NtoM')">n進数 → m進数</button>
        <div id="baseSelection" style="margin-top: 20px;"></div>
    </div>
</div>

<div id="gamePage" class="page" style="display: none;">
    <div class="game-container">
        <div class="game-area">
            <h1 style="margin: 5px 0;">問題</h1>
            <p style="margin: 5px 0;">連続正解数: <span id="streakCount">0</span></p>
            <p id="question" style="font-size: 1.5em; font-weight: bold; margin: 20px 0;"></p>
            
            <div style="margin: 5px 0;">
                <input type="text" id="answer" placeholder="答えを入力" style="font-size: 1.3em; padding: 10px; width: 200px;">
            </div>
            
            <div style="height: 50px; margin: 15px 0;">
                <button id="checkBtn" onclick="check()" style="font-size: 1.1em; padding: 10px 25px; background: #3498db; color: white; border: none; border-radius: 5px;">回答</button>
                <button id="nextBtn" onclick="generateQuestion()" style="display: none; font-size: 1.1em; padding: 10px 25px; background: #2ecc71; color: white; border: none; border-radius: 5px;">次の問題</button>
            </div>
            
            <p id="feedback" style="min-height: 1.5em; margin: 5px 0; font-size: 1.3em;"></p>
            
            <button class="back-menu-btn" onclick="goBack()">メニューに戻る</button>
        </div>
        
        <div id="calculator-placeholder"></div>
    </div>
</div>

<script src="common.js?ver=104"></script>
<script>
    let currentMode = "";
    let currentAnswer = "";
    let currentStreak = 0;

    function createCheckboxes(label, id, include10) {
        let html = `<div>${label}</div><div class="btn-group">
            <button onclick="toggleAll('${id}', true)">全選択</button>
            <button onclick="toggleAll('${id}', false)">全解除</button>
        </div>`;
        html += `<div class="checkbox-group">`;
        for(let i=2; i<=16; i++) {
            if (!include10 && i === 10) continue;
            html += `<label style="width:70px"><input type="checkbox" name="${id}" value="${i}" checked> ${i}進</label>`;
        }
        html += `</div>`;
        return html;
    }

    function showSelection(mode) {
        currentMode = mode;
        let modeLabel = mode === '10toN' ? "10進数 → n進数" : (mode === 'Nto10' ? "n進数 → 10進数" : "n進数 → m進数");
        let html = `<div class="mode-title">【モード：${modeLabel}】</div>`;
        html += mode === 'NtoM' ? createCheckboxes('変換元 (n):', 'nIn', true) + createCheckboxes('変換先 (m):', 'mIn', true) : createCheckboxes('対象の進数を選択:', 'nIn', false);
        html += `<br><button onclick="initGame()" class="back-menu-btn" style="width: auto;">ゲーム開始</button>`;
        document.getElementById('baseSelection').innerHTML = html;
        
        // 生成後に影イベントを適用
        if (typeof applyButtonFeedback === 'function') applyButtonFeedback();
    }

    function initGame() {
        const placeholder = document.getElementById('calculator-placeholder');
        if (placeholder && placeholder.innerHTML.trim() === "") {
            if (typeof setupCalculator === 'function') setupCalculator();
        }

        const menu = document.getElementById('menuPage');
        const game = document.getElementById('gamePage');
        
        menu.style.display = 'none';
        game.style.display = 'block';
        menu.classList.remove('active');
        game.classList.add('active');
        
        currentStreak = 0;
        document.getElementById("streakCount").innerText = 0;
        generateQuestion();
        
        // 画面切り替え後に電卓ボタン等のイベントも再適用
        if (typeof applyButtonFeedback === 'function') applyButtonFeedback();
    }

    function goBack() {
        document.getElementById('gamePage').style.display = 'none';
        document.getElementById('menuPage').style.display = 'block';
        document.getElementById('gamePage').classList.remove('active');
        document.getElementById('menuPage').classList.add('active');
    }

    function generateQuestion() {
        if (typeof clearCalculator === 'function') clearCalculator();
        let nList = [], mList = [];
        document.getElementsByName('nIn').forEach(e => { if(e.checked) nList.push(parseInt(e.value)); });
        if(currentMode === 'NtoM') document.getElementsByName('mIn').forEach(e => { if(e.checked) mList.push(parseInt(e.value)); });

        let baseN = nList[Math.floor(Math.random() * nList.length)];
        let baseM = currentMode === '10toN' ? baseN : (currentMode === 'Nto10' ? 10 : mList[Math.floor(Math.random() * mList.length)]);
        if (currentMode === '10toN') baseN = 10;
        
        if (baseN === baseM) { generateQuestion(); return; }

        let val = Math.floor(Math.random() * 255) + 1;
        document.getElementById("question").innerText = `${baseN}進数の ${val.toString(baseN).toUpperCase()} を ${baseM}進数にすると？`;
        currentAnswer = val.toString(baseM).toUpperCase();
        document.getElementById("answer").value = "";
        document.getElementById("feedback").innerText = "";
        document.getElementById("checkBtn").style.display = "inline-block";
        document.getElementById("nextBtn").style.display = "none";
    }

    function check() {
        let ans = document.getElementById("answer").value.trim().toUpperCase();
        let fb = document.getElementById("feedback");
        if (ans === currentAnswer) {
            fb.innerText = "正解！"; fb.style.color = "green"; currentStreak++;
        } else {
            fb.innerText = `残念…正解は ${currentAnswer} です。`; fb.style.color = "red"; currentStreak = 0;
        }
        document.getElementById("streakCount").innerText = currentStreak;
        document.getElementById("checkBtn").style.display = "none";
        document.getElementById("nextBtn").style.display = "inline-block";
    }
</script>
</body>
</html>
